services:
  api:
    build: .
    image: botucaflix
    restart: always
    ports:
      - 3002:3001
    environment:
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: botucaflixdb
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - .:/app
    networks:
      - mynetwork

  db:
    image: mysql:8.0.32
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - 3307:3306
    volumes:
     - ./db_data:/var/lib/mysql
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge