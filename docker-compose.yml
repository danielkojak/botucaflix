services:
  api:
    build: .
    image: botucaflix
    restart: always
    ports:
      - 3001:3001
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_USER: ${NODE_ENV}_DB_USER
      DB_PASSWORD: ${NODE_ENV}_DB_PASSWORD
      DB_NAME: ${NODE_ENV}_DB_NAME
      DB_HOST: db
    env_file:
      - .env
    depends_on:
      - db
    command: dev
    volumes:
      - .:/app
    networks:
      - mynetwork

  db:
    image: mysql:8.0.32
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - 3307:3306
    volumes:
     - ./db_data:/var/lib/mysql
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge